spring:
  application:
    name: telemetry-system
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/healthcare_db}
    username: ${SPRING_DATASOURCE_USERNAME:healthcare_user}
    password: ${SPRING_DATASOURCE_PASSWORD:healthcare_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:super_secret_jwt_key_that_should_be_at_least_256_bits_long_for_hs256_fallback}
  expiration: ${JWT_EXPIRATION_MS:86400000}
